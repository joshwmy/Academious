services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: academious
      # No default on purpose. Compose fails with this message rather than
      # starting a database whose password is in a committed file.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: academious
    # Bound to loopback, never 0.0.0.0. A bare "5432:5432" on a public host
    # publishes Postgres to the internet, and Docker writes its iptables rules
    # ahead of ufw's chain, so a host firewall does not save you. Local psql
    # and alembic still reach it here.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academious -d academious"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    command: uvicorn academious.api.main:app --host 0.0.0.0 --port 8000
    environment:
      ACADEMIOUS_DATABASE_URL: postgresql+psycopg://academious:${POSTGRES_PASSWORD}@db:5432/academious
      # SPECTER2's weights are ~440 MB and are fetched on first use. Without a
      # persistent cache every `run --rm` re-downloads them, which for the cron
      # entries in docs/deployment.md means that cost on every scheduled job.
      ACADEMIOUS_EMBEDDING_CACHE_DIR: /models
    env_file: [.env]
    volumes:
      - modelcache:/models
    # Loopback for the same reason as db. In production Caddy reaches the API
    # over the compose network, not through this mapping.
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    # Not started by `up`. Cron invokes this with `run --rm`, and `run` starts a
    # profiled service on demand, so the profile costs nothing operationally and
    # buys the thing that matters: `up -d` on a fresh machine used to launch a
    # harvest against a database that had not been migrated yet, and every
    # connector died on a missing `source_cursor`. It also meant each deploy
    # fired an unscheduled harvest, ignoring the off-peak windows the sources
    # ask for.
    profiles: ["manual"]
    build: .
    command: python -m academious.workers harvest --source all
    environment:
      ACADEMIOUS_DATABASE_URL: postgresql+psycopg://academious:${POSTGRES_PASSWORD}@db:5432/academious
      ACADEMIOUS_EMBEDDING_CACHE_DIR: /models
    env_file: [.env]
    volumes:
      - modelcache:/models
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
  # Shared by api and worker: both encode, so both load the same weights.
  modelcache:
