<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-labelledby="academious-mark-title">
  <title id="academious-mark-title">Academious</title>
  <!--
    The feed: three lines narrowing from the whole literature to the few papers
    worth reading today, and a dot where the reader's attention lands. Same
    geometry as LogoMark in src/components/Logo.tsx; scripts/build-icons.py
    rasterises it. Change all three together.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7d8af0" />
      <stop offset="1" stop-color="#6359dc" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#g)" />
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round">
    <path d="M9 10.5H23" />
    <path d="M9 16H19.5" />
    <path d="M9 21.5H15.5" />
  </g>
  <circle cx="22" cy="21.5" r="2" fill="#d4d0fb" />
</svg>
