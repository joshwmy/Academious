<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 32" role="img" aria-labelledby="academious-logo-title">
  <title id="academious-logo-title">Academious</title>
  <!--
    The horizontal lockup: mark, a quarter-mark of clear space, lowercase
    wordmark in navy. The wordmark is live text in the product's sans stack, so
    this file is font-dependent; it is right in a browser but not a
    press-ready outlined asset.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7d8af0" />
      <stop offset="1" stop-color="#6359dc" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#g)" />
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round">
    <path d="M9 10.5H23" />
    <path d="M9 16H19.5" />
    <path d="M9 21.5H15.5" />
  </g>
  <circle cx="22" cy="21.5" r="2" fill="#d4d0fb" />
  <text
    x="41" y="23.5"
    font-family="Inter, 'Segoe UI Variable', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif"
    font-size="22"
    font-weight="600"
    letter-spacing="-0.7"
    fill="#171b2e"
  >academious</text>
</svg>
