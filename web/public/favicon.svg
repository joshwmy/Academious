<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-labelledby="academious-favicon-title">
  <title id="academious-favicon-title">Academious</title>
  <!--
    The mark at tab-strip size. The dot is dropped and the lines are heavier:
    at 16px a 2px dot is one blurred pixel, and 3px strokes thin to grey. The
    filled tile carries its own background, so it reads on light and dark tab
    strips alike without a prefers-color-scheme branch.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7d8af0" />
      <stop offset="1" stop-color="#6359dc" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#g)" />
  <g stroke="#ffffff" stroke-width="3.8" stroke-linecap="round">
    <path d="M8.5 10H23.5" />
    <path d="M8.5 16H19.5" />
    <path d="M8.5 22H15" />
  </g>
</svg>
