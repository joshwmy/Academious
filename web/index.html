<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />

    <title>Academious — new research worth your attention</title>
    <meta
      name="description"
      content="Academious is a discovery layer over recent scientific literature. Browse and search a curated corpus drawn from arXiv, bioRxiv/medRxiv and Europe PMC."
    />

    <!-- The browser chrome tracks the page, not the other way round. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f5f2" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#16171a" />

    <!-- SVG first, because it is theme-aware and resolution-independent; the
         .ico is the fallback for browsers that will not read it. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Academious" />
    <meta property="og:title" content="Academious — new research worth your attention" />
    <meta
      property="og:description"
      content="A discovery layer over recent scientific literature. Browse and search a curated corpus drawn from arXiv, bioRxiv/medRxiv and Europe PMC."
    />
    <meta property="og:url" content="https://academious.org/" />
    <meta property="og:image" content="https://academious.org/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Academious" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- No third-party scripts, fonts, analytics or trackers are loaded.
         Everything the page needs is served from this origin. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
