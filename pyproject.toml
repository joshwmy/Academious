[project]
name = "academious"
version = "0.1.0"
description = "A discovery layer over global scientific literature"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "tenacity>=9.0",
    "structlog>=24.4",
    "defusedxml>=0.7.1",
    "python-dateutil>=2.9",
    "pgvector>=0.4",
    "numpy>=2.0",
    # Inbound rate limiting for the public API. Process-local storage by
    # default; see docs/security.md on what that does and does not bound.
    "slowapi>=0.1.10",
]

[project.optional-dependencies]
# The model stack is optional on purpose. Retrieval, the API and every test
# outside test_specter2_slow.py run without torch; only actually generating
# SPECTER2 vectors needs it, and it is ~2 GB installed.
embed = [
    "torch>=2.9,<3",
    "transformers~=4.57.6",
    "adapters>=1.3,<2",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "respx>=0.22",
    "ruff>=0.8",
    "mypy>=1.13",
    # Security gates. Both are CI-friendly and neither pulls in a service.
    "pip-audit>=2.10",
    "bandit>=1.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: requires a live PostgreSQL (set ACADEMIOUS_TEST_DATABASE_URL); skipped otherwise",
    "model: downloads and runs SPECTER2; needs the `embed` extra. Deselect with -m 'not model'",
]
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.ruff.lint.isort]
# `tests` is a real package here (tests/factories.py is imported by test
# modules); without this, isort keeps moving it into the third-party block.
known-first-party = ["academious", "tests"]

[tool.mypy]
python_version = "3.12"
packages = ["academious"]
mypy_path = "src"
strict = true
warn_return_any = true
disallow_untyped_defs = true

# These ship no py.typed marker or stubs. Silencing them per-module keeps
# `strict` in force everywhere else rather than weakening the whole config.
[[tool.mypy.overrides]]
module = ["defusedxml.*", "adapters.*", "pgvector.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# transformers is partially typed: several classmethods on the Auto* factories
# are untyped, and calling them is unavoidable. The surrounding module keeps
# every other strict check.
module = "academious.embeddings.specter2"
disallow_untyped_calls = false
